<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Interview - PlacePrep</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-content">
            <a href="/" class="nav-brand">
                <div class="nav-brand-icon">🚀</div>
                <span class="gradient-text">PlacePrep</span>
            </a>
            <ul class="nav-links">
                <li><a href="/dashboard.html">Dashboard</a></li>
                <li><a href="/skillgap.html">Role Based Analyzer</a></li>
                <li><a href="/interview.html">Interview</a></li>
                <li><a href="/resume.html">Resume</a></li>
                <li><a href="/progress.html">Analysis</a></li>
            </ul>
            <div class="nav-user">
                <div class="nav-xp">
                    <span class="nav-xp-value">0</span> XP
                </div>
                <div class="nav-streak">
                    🔥 <span class="nav-streak-value">0</span>
                </div>
                <div class="nav-avatar" title="Logout" onclick="App.logout()">U</div>
            </div>
            <button class="mobile-toggle"
                onclick="document.querySelector('.nav-links').classList.toggle('mobile-open')">☰</button>
        </div>
    </nav>

    <div class="page-wrapper container">
        <header class="page-header">
            <h1>🎤 Mock Interview</h1>
            <p>Practice role-specific interview questions and get AI-powered evaluation.</p>
        </header>

        <div class="content-grid sidebar">
            <div class="main-content">

                <!-- Setup form – hidden when active session is running -->
                <div id="setup-section">
                    <div class="glass-card animate-in">
                        <h3 style="margin-bottom: 24px;">Configure Your Session</h3>
                        <form id="interview-form">
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                                <div class="form-group">
                                    <label class="form-label">Target Role</label>
                                    <select class="form-select" id="int-role" required>
                                        <option value="Software Engineer">Software Engineer</option>
                                        <option value="Frontend Developer">Frontend Developer</option>
                                        <option value="Backend Developer">Backend Developer</option>
                                        <option value="Data Scientist">Data Scientist</option>
                                        <option value="Full Stack Developer">Full Stack Developer</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Company (Optional)</label>
                                    <input type="text" class="form-input" id="int-company"
                                        placeholder="e.g. Google, Amazon">
                                </div>
                            </div>

                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                                <div class="form-group">
                                    <label class="form-label">Difficulty</label>
                                    <select class="form-select" id="int-difficulty">
                                        <option value="easy">Easy</option>
                                        <option value="medium" selected>Medium</option>
                                        <option value="hard">Hard</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Interview Type</label>
                                    <select class="form-select" id="int-category">
                                        <option value="technical">Technical</option>
                                        <option value="behavioral">Behavioral</option>
                                        <option value="hr">HR Round</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Number of Questions</label>
                                <select class="form-select" id="int-num">
                                    <option value="3">3 Questions</option>
                                    <option value="5" selected>5 Questions</option>
                                    <option value="10">10 Questions</option>
                                </select>
                            </div>

                            <div style="margin-top: 12px;">
                                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">🚀 Generate
                                    Interview</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Questions during live session / detail view from history -->
                <div id="questions-section" style="display: none;">
                    <div id="questions-container">
                        <!-- Rendered by JS -->
                    </div>
                </div>

            </div>

            <!-- Always-visible sidebar -->
            <aside class="sidebar-content">
                <div class="glass-card animate-in">
                    <h3 style="margin-bottom: 20px;">📜 Past Sessions</h3>
                    <div id="interview-history">
                        <!-- Rendered by JS -->
                        <div class="skeleton" style="height: 60px; margin-bottom: 10px;"></div>
                        <div class="skeleton" style="height: 60px;"></div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <div class="toast-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/interview.js"></script>
</body>

</html>
