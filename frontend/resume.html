<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Analysis - PlacePrep</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-content">
            <a href="/" class="nav-brand">
                <div class="nav-brand-icon">🚀</div>
                <span class="gradient-text">PlacePrep</span>
            </a>
            <ul class="nav-links">
                <li><a href="/dashboard.html">Dashboard</a></li>
                <li><a href="/skillgap.html">Role Based Analyzer</a></li>
                <li><a href="/interview.html">Interview</a></li>
                <li><a href="/resume.html">Resume</a></li>
                <li><a href="/progress.html">Analysis</a></li>
            </ul>
            <div class="nav-user">
                <div class="nav-xp">
                    <span class="nav-xp-value">0</span> XP
                </div>
                <div class="nav-streak">
                    🔥 <span class="nav-streak-value">0</span>
                </div>
                <div class="nav-avatar" title="Logout" onclick="App.logout()">U</div>
            </div>
            <button class="mobile-toggle"
                onclick="document.querySelector('.nav-links').classList.toggle('mobile-open')">☰</button>
        </div>
    </nav>

    <div class="page-wrapper container">
        <header class="page-header">
            <h1>📄 Resume Analysis</h1>
            <p>Upload your resume to get AI-powered insights and ATS compatibility scores.</p>
        </header>

        <div class="content-grid wide-sidebar">
            <div class="main-content">
                <div class="glass-card animate-in" style="margin-bottom: 24px;">
                    <div class="upload-zone" id="upload-zone">
                        <div class="upload-icon">📤</div>
                        <div class="upload-text">Drop your resume here or click to browse</div>
                        <div class="upload-hint">Supports PDF, TXT, DOC, DOCX • Max 10MB</div>
                        <input type="file" id="file-input" style="display: none;" accept=".pdf,.txt,.doc,.docx">
                    </div>
                    <div style="margin-top: 16px; display: flex; align-items: center; gap: 12px;">
                        <label class="form-label" style="margin: 0;">Target Role:</label>
                        <select class="form-select" id="target-role" style="flex: 1;">
                            <option value="Software Engineer">Software Engineer</option>
                            <option value="Frontend Developer">Frontend Developer</option>
                            <option value="Backend Developer">Backend Developer</option>
                            <option value="Data Scientist">Data Scientist</option>
                            <option value="Full Stack Developer">Full Stack Developer</option>
                        </select>
                    </div>
                </div>

                <div id="analysis-results" style="display: none;">
                    <!-- Rendered by JS -->
                </div>
            </div>

            <aside class="sidebar-content">
                <div class="glass-card animate-in">
                    <h3 style="margin-bottom: 20px;">📜 Analysis History</h3>
                    <div id="resume-history">
                        <!-- Rendered by JS -->
                        <div class="skeleton" style="height: 60px; margin-bottom: 10px;"></div>
                        <div class="skeleton" style="height: 60px; margin-bottom: 10px;"></div>
                        <div class="skeleton" style="height: 60px;"></div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <div class="toast-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/resume.js"></script>
</body>

</html>
