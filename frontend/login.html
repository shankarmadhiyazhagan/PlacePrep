<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlacePrep - Sign In</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card glass-card">
                <div class="auth-header">
                    <a href="/" class="nav-brand" style="justify-content:center;margin-bottom:8px">
                        <div class="nav-brand-icon">🚀</div>
                        <span class="gradient-text">PlacePrep</span>
                    </a>
                    <p style="color:var(--text-muted);font-size:0.9rem">AI-Powered Placement Preparation</p>
                </div>

                <div class="auth-toggle">
                    <button class="auth-toggle-btn active" data-mode="login">Sign In</button>
                    <button class="auth-toggle-btn" data-mode="register">Create Account</button>
                </div>

                <!-- Login Form -->
                <form id="login-form">
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-input" id="login-username" placeholder="Enter username" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-input" id="login-password" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px">Sign In</button>
                </form>

                <!-- Register Form -->
                <form id="register-form" style="display:none">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-input" id="reg-fullname" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-input" id="reg-username" placeholder="Choose a username" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-input" id="reg-email" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Target Role</label>
                        <select class="form-select" id="reg-role">
                            <option value="Software Engineer">Software Engineer</option>
                            <option value="Frontend Developer">Frontend Developer</option>
                            <option value="Backend Developer">Backend Developer</option>
                            <option value="Data Scientist">Data Scientist</option>
                            <option value="Full Stack Developer">Full Stack Developer</option>
                            <option value="DevOps Engineer">DevOps Engineer</option>
                            <option value="Product Manager">Product Manager</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-input" id="reg-password" placeholder="Create a password" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-input" id="reg-confirm" placeholder="Confirm your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px">Create Account</button>
                </form>
            </div>
        </div>
    </div>

    <div class="toast-container"></div>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
