<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PlacePrep</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-content">
            <a href="/" class="nav-brand">
                <div class="nav-brand-icon">🚀</div>
                <span class="gradient-text">PlacePrep</span>
            </a>
            <ul class="nav-links">
                <li><a href="/dashboard.html">Dashboard</a></li>
                <li><a href="/skillgap.html">Role Based Analyzer</a></li>
                <li><a href="/interview.html">Interview</a></li>
                <li><a href="/resume.html">Resume</a></li>
                <li><a href="/progress.html">Analysis</a></li>
            </ul>
            <div class="nav-user">
                <div class="nav-xp">
                    <span class="nav-xp-value">0</span> XP
                </div>
                <div class="nav-streak">
                    🔥 <span class="nav-streak-value">0</span>
                </div>
                <div class="nav-avatar" title="Logout" onclick="App.logout()">U</div>
            </div>
            <button class="mobile-toggle"
                onclick="document.querySelector('.nav-links').classList.toggle('mobile-open')">☰</button>
        </div>
    </nav>

    <div class="page-wrapper container">
        <header class="page-header" id="user-header">
            <!-- Rendered by JS -->
            <div class="skeleton" style="height: 100px; width: 100%"></div>
        </header>

        <div class="stats-grid" id="stats-grid">
            <!-- Rendered by JS -->
            <div class="skeleton" style="height: 100px;"></div>
            <div class="skeleton" style="height: 100px;"></div>
            <div class="skeleton" style="height: 100px;"></div>
            <div class="skeleton" style="height: 100px;"></div>
        </div>

        <div class="content-grid sidebar">
            <div class="main-content">
                <div class="glass-card animate-in" style="margin-bottom: 24px;">
                    <h3 style="margin-bottom: 20px;">📈 Interview Score Trend</h3>
                    <div id="interview-trend" style="min-height: 200px;">
                        <div class="skeleton" style="height: 200px; width: 100%"></div>
                    </div>
                </div>

                <div class="glass-card animate-in">
                    <h3 style="margin-bottom: 20px;">⏱️ Recent Activity</h3>
                    <div id="recent-activity">
                        <div class="skeleton" style="height: 60px; margin-bottom: 10px;"></div>
                        <div class="skeleton" style="height: 60px; margin-bottom: 10px;"></div>
                        <div class="skeleton" style="height: 60px;"></div>
                    </div>
                </div>
            </div>

            <aside class="sidebar-content">
                <div class="glass-card animate-in" style="margin-bottom: 24px;">
                    <h3 style="margin-bottom: 20px;">🎯 Preparation Readiness</h3>
                    <div id="score-cards" style="display: flex; flex-direction: column; gap: 20px;">
                        <!-- Rendered by JS -->
                        <div class="skeleton" style="height: 120px; width: 100%"></div>
                    </div>
                </div>

                <div class="glass-card animate-in">
                    <h3 style="margin-bottom: 16px;">🚀 Quick Actions</h3>
                    <div style="display: grid; gap: 12px;">
                        <a href="/resume.html" class="btn btn-secondary" style="justify-content: flex-start;">📄 Analyze
                            Resume</a>
                        <a href="/interview.html" class="btn btn-secondary" style="justify-content: flex-start;">🎤 Mock
                            Interview</a>
                        <a href="/skillgap.html" class="btn btn-secondary" style="justify-content: flex-start;">📊 Skill
                            Gap Analysis</a>
                        <a href="/progress.html" class="btn btn-outline" style="justify-content: flex-start;">📈 View
                            Analysis</a>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <div class="toast-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/dashboard.js"></script>
</body>

</html>
